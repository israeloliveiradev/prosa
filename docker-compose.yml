name: prosa

# Passwords come from secrets/runtime.env via env_file.
# Compose does not interpolate that file, so "$", quotes and backticks stay literal.

services:
  postgres:
    image: postgres:16-alpine
    container_name: prosa-postgres
    restart: unless-stopped
    env_file:
      - ./secrets/runtime.env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - prosa_postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init_prosa_enterprise.sql:/docker-entrypoint-initdb.d/001_init_prosa_enterprise.sql:ro
    shm_size: 512mb
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=80MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=500
      - -c
      - log_checkpoints=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - prosa

  redis:
    image: redis:7-alpine
    container_name: prosa-redis
    restart: unless-stopped
    env_file:
      - ./secrets/runtime.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec /usr/local/bin/docker-entrypoint.sh redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - prosa_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    networks:
      - prosa

  api:
    build: .
    container_name: prosa-api
    restart: unless-stopped
    env_file:
      - ./secrets/runtime.env
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      EDGE_TTS_URL: http://edge-tts:8077
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_INBOX_URL: http://localhost:8025
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      edge-tts:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - prosa

  edge-tts:
    build: ./services/edge-tts
    container_name: prosa-edge-tts
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8077"
    ports:
      - "127.0.0.1:8077:8077"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8077/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - prosa

  mailpit:
    image: axllent/mailpit:latest
    container_name: prosa-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      - prosa

volumes:
  prosa_postgres_data:
  prosa_redis_data:

networks:
  prosa:
    driver: bridge
