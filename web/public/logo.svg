<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- 1. TACTILE KEYCAP & BOOK ICON (60x60 container, 4px bottom bevel) -->
  <g transform="translate(10, 10)">
    <!-- 4px Mechanical Bevel / Bottom Base Shadow -->
    <rect x="0" y="6" width="60" height="52" rx="16" fill="#0F766E"/>
    <!-- Top Face of Button / Keycap in Emerald Teal -->
    <rect x="0" y="0" width="60" height="52" rx="16" fill="#0D9488"/>
    <!-- Inner Highlight Rim -->
    <rect x="1.5" y="1.5" width="57" height="49" rx="14.5" stroke="#14B8A6" stroke-width="1.5" fill="none"/>

    <!-- Crisp Monogram 'P' (Spine + Open Book Page) in #FDFBF7 -->
    <rect x="14" y="11" width="7" height="30" rx="3.5" fill="#FDFBF7"/>
    <path d="M18 11H34C40.6274 11 46 16.3726 46 23C46 29.6274 40.6274 35 34 35H18V11Z" fill="#FDFBF7"/>
    
    <!-- Open Book Page Contour Cutout inside Counter -->
    <path d="M21 16H33.5C37.0899 16 40 18.9101 40 22.5C40 26.0899 37.0899 29 33.5 29H21V16Z" fill="#0D9488"/>
    <path d="M22 22.5C25.5 21 31 21.5 35 23" stroke="#14B8A6" stroke-width="2" stroke-linecap="round"/>
    <polygon points="14,35 17.5,41 21,35" fill="#E2E8F0"/>

    <!-- Vibrant Spark Dot in Warm Streak Orange (#FF5722) -->
    <circle cx="48" cy="10" r="5" fill="#FF5722"/>
    <circle cx="48" cy="10" r="2.2" fill="#FF8A65"/>
  </g>

  <!-- 2. GEOMETRIC WORDMARK 'PROSA' -->
  <text x="88" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="3" fill="#1C1917">PROSA</text>
  <circle cx="282" cy="46" r="4.5" fill="#0D9488"/>
</svg>
